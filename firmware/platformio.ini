; Vacuum Burst Lab controller firmware
; Build & upload:  pio run -t upload      Serial monitor:  pio device monitor

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
lib_deps =
    adafruit/Adafruit MAX31855 library@^1.4.2
    bogde/HX711@^0.7.5
